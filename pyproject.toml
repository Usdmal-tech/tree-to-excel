[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-to-excel"
version = "1.0.3"
description = "Convert Windows tree command output to Excel with structured formatting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Usdmal", email = "ggg.qqq.1911@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Development Status :: 4 - Beta",
]
requires-python = ">= 3.8"
dependencies = [
    "openpyxl>=3.1.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Usdmal-tech/tree-to-excel"
Repository = "https://github.com/Usdmal-tech/tree-to-excel"

[project.scripts]
tree-to-excel = "tree_to_excel.tree_to_excel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "B", "C", "UP"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
