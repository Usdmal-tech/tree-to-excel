[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tree-to-excel"
version = "1.0.3"
description = "Convert Windows tree command output to Excel with structured formatting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Usdmal", email = "ggg.qqq.1911@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Filesystems",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Development Status :: 4 - Beta",
]
requires-python = ">= 3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "chardet>=5.2.0",
]

[project.urls]
Homepage = "https://github.com/Usdmal-tech/tree-to-excel"
Repository = "https://github.com/Usdmal-tech/tree-to-excel"

[project.scripts]
tree-to-excel = "tree_to_excel.tree_to_excel:main"

# Если Poetry не найдёт пакет автоматически (обычно находит), можно указать явно:
[tool.poetry]
packages = [
    { include = "tree_to_excel", from = "src" },
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "B", "C", "UP"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "ruff (>=0.16.5)",
    "pre-commit (>=4.6.2,<5.0.0)"
]
